services:
  rag-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Point at a vLLM / OpenAI-compatible server instead of running the model in-process:
      - LLM_BACKEND=${LLM_BACKEND:-hf}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
    volumes:
      - hf-cache:/home/appuser/.cache/huggingface   # persist model weights across restarts
    healthcheck:
      # python-slim has no curl; use the interpreter that's already there
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s   # allow time for model loading
    restart: unless-stopped

volumes:
  hf-cache:
