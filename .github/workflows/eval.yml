name: Tests and retrieval eval

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q

  retrieval-eval:
    # Recall@k / MRR of the gold source page for every campus question, per retrieval
    # mode. Fails the PR if hybrid_rerank drops below eval/thresholds.json.
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('app/config.py') }}
          restore-keys: hf-

      - name: Install (CPU torch keeps the install small)
        run: |
          pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Build corpus if no snapshot is committed
        run: |
          if [ ! -f corpus/chunks.jsonl ]; then python -m ingest.crawl; fi
          wc -l corpus/chunks.jsonl

      - name: Retrieval ablation + gate
        run: python -m eval.retrieval_eval --gate

      - name: Add results to the job summary
        if: always()
        run: cat eval/results/retrieval.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-eval
          path: eval/results/
          retention-days: 90
